[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
# Where to host releases
hosting = ["github"]
# Whether to install an updater program
install-updater = false
# Generate SHA-256 checksums for release artifacts
checksum = "sha256"
# Use a human-created draft release and dispatch releases explicitly
dispatch-releases = true
create-release = false
# Pull requests validate the release plan without building artifacts
pr-run-mode = "plan"
# Attest every artifact together when it is uploaded to the draft release
github-attestations = true
github-attestations-phase = "host"
# GitHub already provides source archives
source-tarball = false
# Run the ordinary CI gate before release builds
plan-jobs = ["./ci"]
# Execute every native archive before it can be hosted
global-artifacts-jobs = ["./smoke-artifacts"]
# Stable releases update Homebrew through an idempotent custom publisher;
# prereleases leave the tap unchanged
publish-jobs = ["./publish-homebrew"]
publish-prereleases = false
# crates.io has an independent stable/prerelease policy
post-announce-jobs = ["./publish-crates"]
# Homebrew publishing details
tap = "jrpat/homebrew-ite-tap"
formula = "ite"
# Human-facing application name used in generated release text
display-name = "Ite"

[dist.github-custom-job-permissions.ci]
contents = "read"

[dist.github-custom-job-permissions.smoke-artifacts]
contents = "read"

[dist.github-custom-job-permissions.publish-homebrew]
contents = "read"

[dist.github-custom-job-permissions.publish-crates]
contents = "read"
id-token = "write"
